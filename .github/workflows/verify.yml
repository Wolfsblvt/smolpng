name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./tools/corpus --check
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux, darwin]
        arch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build console CLI
        run: go build -trimpath -ldflags "-X github.com/Wolfsblvt/smolpng/internal/cli.Commit=$SOURCE_COMMIT" -o artifacts/bin/ ./cmd/smolpng
      - name: Build explicit Windows background entry
        if: matrix.os == 'windows'
        run: go build -trimpath -ldflags "-H=windowsgui -X github.com/Wolfsblvt/smolpng/internal/cli.Commit=$SOURCE_COMMIT" -o artifacts/bin/smolpngw.exe ./cmd/smolpngw
      - name: Build real-host qualification helper (not run in ordinary CI)
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          go build -trimpath -ldflags "-X main.Commit=$SOURCE_COMMIT" -o "artifacts/bin/smolpng-qualify$suffix" ./tools/qualify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smolpng-${{ matrix.os }}-${{ matrix.arch }}-${{ env.SOURCE_COMMIT }}
          path: artifacts/bin/
          if-no-files-found: error
          retention-days: 14
