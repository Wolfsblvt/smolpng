name: Bootstrap build environment
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-environment.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Export isolated public toolchain and candidate modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          work="$(mktemp -d)"
          export GOMODCACHE="$work/modules"
          export GOCACHE="$work/build-cache"
          cd "$work"
          go mod init smolpng-build-transport
          go get github.com/spf13/cobra@v1.10.2 github.com/pelletier/go-toml/v2@v2.4.3 charm.land/huh/v2@v2.0.3 golang.design/x/clipboard@v0.9.0 github.com/zalando/go-keyring@v0.2.8 github.com/adrg/xdg@v0.5.3 github.com/bmatcuk/doublestar/v4@latest github.com/sabhiram/go-gitignore@latest golang.org/x/image@latest golang.org/x/term@latest
          go mod download all
          go mod verify
          cp go.mod go.sum "$GITHUB_WORKSPACE/artifacts/bootstrap/"
          go list -m -json all > "$GITHUB_WORKSPACE/artifacts/bootstrap/modules.json"
          go version > "$GITHUB_WORKSPACE/artifacts/bootstrap/toolchain.txt"
          tar -C "$(go env GOROOT)" -czf "$GITHUB_WORKSPACE/artifacts/bootstrap/go-linux-amd64.tar.gz" .
          tar -C "$GOMODCACHE" -czf "$GITHUB_WORKSPACE/artifacts/bootstrap/modules.tar.gz" .
          cd "$GITHUB_WORKSPACE"
          git bundle create artifacts/bootstrap/source.bundle --all
          cd artifacts/bootstrap
          sha256sum *.gz source.bundle go.mod go.sum modules.json toolchain.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smolpng-build-transport
          path: artifacts/bootstrap/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
