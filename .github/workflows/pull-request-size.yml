name: Pull-request size

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request to measure
        required: true
        type: string
      apply:
        description: Apply the accepted policy (requires DIFFDEVIL_ACTION_ENABLED)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: diffdevil-size-${{ github.event.pull_request.number || inputs.number }}
  cancel-in-progress: false

jobs:
  size:
    # Manual previews work while disabled. Neither branch dispatch nor ordinary
    # size-label events may enter this privileged route.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       (!inputs.apply || vars.DIFFDEVIL_ACTION_ENABLED == 'true')) ||
      (github.event_name == 'pull_request_target' && vars.DIFFDEVIL_ACTION_ENABLED == 'true' &&
       (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
        github.event.label.name == '🛠️ Manual Triage' || github.event.label.name == '🛠️ No Auto-reply'))
    runs-on: ubuntu-latest
    steps:
      - id: target
        name: Read the current pull request and maintainer controls
        env:
          GH_READ_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ github.event.pull_request.number || inputs.number }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const number = process.env.REQUESTED_PR;
          if (!/^[1-9][0-9]*$/.test(number ?? '')) throw new Error('A positive PR number is required.');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${number}`, {
            headers: {
              authorization: `Bearer ${process.env.GH_READ_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
            },
          });
          if (!response.ok) throw new Error(`Current PR read failed (HTTP ${response.status}).`);
          const pr = await response.json();
          if (pr.number !== Number(number) || pr.base.repo.full_name !== process.env.GITHUB_REPOSITORY || pr.base.ref !== 'main') {
            throw new Error('Refused a PR outside this repository and main base.');
          }
          const labels = new Set(pr.labels.map(label => label.name));
          const proceed = pr.state === 'open' && !labels.has('🛠️ Manual Triage');
          const rule = labels.has('🛠️ No Auto-reply') ? 'size' : '';
          appendFileSync(process.env.GITHUB_OUTPUT, `proceed=${proceed}\nnumber=${number}\nrule=${rule}\n`);
          console.log(proceed ? `Sizing PR #${number}; replies ${rule ? 'paused' : 'allowed'}.` : 'Sizing paused: closed PR or Manual Triage.');
          NODE
      - id: automaton
        name: Mint the repository-scoped Automaton writer
        if: steps.target.outputs.proceed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.apply)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WOLFSBLVT_AUTOMATON_CLIENT_ID }}
          private-key: ${{ secrets.WOLFSBLVT_AUTOMATON_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write
      - name: Verify the selected App before effects
        if: steps.automaton.outputs.token != ''
        env:
          AUTOMATON_APP_SLUG: ${{ steps.automaton.outputs.app-slug }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.AUTOMATON_APP_SLUG !== 'wolfsblvt-automaton') {
            throw new Error('Refused a sizing writer other than Wolfsblvt Automaton.');
          }
          NODE
      - name: Measure and reconcile from trusted base policy
        if: steps.target.outputs.proceed == 'true'
        uses: Wolfsblvt/diffdevil@0827485c9d3795ef58a7934cd7a4b8b3fb5cc9c5 # v1.0.0
        with:
          github-token: ${{ steps.automaton.outputs.token || github.token }}
          policy-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request: ${{ steps.target.outputs.number }}
          mode: ${{ github.event_name == 'workflow_dispatch' && !inputs.apply && 'plan' || 'apply' }}
          config: .diffdevil.yml
          rule: ${{ steps.target.outputs.rule }}
          definitions: none
          comment-author: ${{ (github.event_name != 'workflow_dispatch' || inputs.apply) && 'wolfsblvt-automaton[bot]' || '' }}
          comment-author-id: ${{ (github.event_name != 'workflow_dispatch' || inputs.apply) && '319117825' || '' }}
